name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: python -m py_compile app.py

      - name: JavaScript and 3D smoke checks
        run: |
          test -s assets/mold-3d.js
          node --check assets/mold-3d.js
          grep -q "webgl" assets/mold-3d.js
          grep -q "rotate-auto" assets/mold-3d.js
          grep -q "rotate-reset" assets/mold-3d.js
          grep -q "pointerdown" assets/mold-3d.js
          grep -q "wheel" assets/mold-3d.js
          grep -q "mold-3d.js" app.py

      - name: HTML smoke checks
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert 'class="scene3d"' in html
          assert 'id="rotate-auto"' in html
          assert 'id="rotate-left"' in html and 'id="rotate-right"' in html
          assert 'id="rotate-reset"' in html
          assert "THREE." not in html
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      src = dict(attrs).get("src")
                      if src:
                          self.scripts.append(src)
          p = Parser(); p.feed(html)
          assert all("http://" not in src and "https://" not in src for src in p.scripts)
          PY

      - name: Start FastAPI
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/moldaco-uvicorn.log 2>&1 &
          echo $! > /tmp/moldaco.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done

      - name: Smoke test HTTP endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q 'Moldaço'
          curl -fsS http://127.0.0.1:8000/ | grep -q '/assets/mold-3d.js'
          curl -fsS http://127.0.0.1:8000/assets/mold-3d.js | grep -q 'webgl'
